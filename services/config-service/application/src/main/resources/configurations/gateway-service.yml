server:
  port: ${GATEWAY_SERVICE_PORT}

spring:
  cloud:
    loadbalancer:
      retry:
        enabled: true
        avoid-previous-instance: true

    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 65s

          discovery:
            locator:
              enabled: true

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://${FRONTEND_SERVICE_INSTANCE:localhost}:${FRONTEND_SERVICE_PORT}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Forwarded-For
                  - X-Forwarded-Proto
                allow-credentials: false

          routes:
            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/category/**
              filters:
                - RewritePath=/category/?(?<segment>.*), /${segment}
                - name: Retry
                  args:
                    retries: 2
                    statuses:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                    methods:
                      - GET
                    exceptions:
                      - java.net.ConnectException
                      - io.netty.channel.AbstractChannel$AnnotatedConnectException
                    backoff:
                      firstBackoff: 5s
                      maxBackoff: 15s
                      factor: 2
                      basedOnPreviousValue: true
                    timeout: 55s

            - id: image-service
              uri: lb://image-service
              predicates:
                - Path=/image/**
              filters:
                - RewritePath=/image/?(?<segment>.*), /${segment}

            - id: message-service
              uri: lb://message-service
              predicates:
                - Path=/message/**
              filters:
                - RewritePath=/message/?(?<segment>.*), /${segment}

            - id: moderation-service
              uri: lb://moderation-service
              predicates:
                - Path=/moderation/**
              filters:
                - RewritePath=/moderation/?(?<segment>.*), /${segment}

            - id: post-service
              uri: lb://post-service
              predicates:
                - Path=/post/**
              filters:
                - RewritePath=/post/?(?<segment>.*), /${segment}

            - id: reaction-service
              uri: lb://reaction-service
              predicates:
                - Path=/reaction/**
              filters:
                - RewritePath=/reaction/?(?<segment>.*), /${segment}

            - id: thread-service
              uri: lb://thread-service
              predicates:
                - Path=/thread/**
              filters:
                - RewritePath=/thread/?(?<segment>.*), /${segment}
                - name: Retry
                  args:
                    retries: 2
                    statuses:
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                    methods:
                      - GET
                    exceptions:
                      - java.net.ConnectException
                      - io.netty.channel.AbstractChannel$AnnotatedConnectException
                    backoff:
                      firstBackoff: 200ms
                      maxBackoff: 1s
                      factor: 2
                      basedOnPreviousValue: true
                    timeout: 5s

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/**
              filters:
                - RewritePath=/user/?(?<segment>.*), /${segment}

            - id: openapi
              uri: http://${GATEWAY_SERVICE_INSTANCE:localhost}:${server.port}
              predicates:
                - Path=/v3/api-docs/**
              filters:
                - RewritePath=/v3/api-docs/?(?<segment>.*), /${segment}/v3/api-docs

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers RETAIN_FIRST

  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    use-root-path: true
